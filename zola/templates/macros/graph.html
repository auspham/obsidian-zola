{% macro graph_js(force_local="false") %}
<script>
(function() {
  var graphEl = document.getElementById('graph');
  if (!graphEl) return;
  var loaded = false;
  var forceLocal = "{{ force_local }}" === "true";

  function loadGraph() {
    if (loaded) return;
    loaded = true;

    var s1 = document.createElement('script');
    s1.src = 'https://cdnjs.cloudflare.com/ajax/libs/vis/4.21.0/vis.min.js';
    s1.integrity = 'sha512-XHDcSyqhOoO2ocB7sKOCJEkUjw/pQCJViP1ynpy+EGh/LggzrP6U/V3a++LQTnZT7sCQKeHRyWHfhN2afjXjCg==';
    s1.crossOrigin = 'anonymous';
    s1.referrerPolicy = 'no-referrer';
    s1.onload = function() {
      var s2 = document.createElement('script');
      s2.src = '{{ get_url(path="js/graph_info.js") | safe }}';
      s2.onload = function() {
        if (forceLocal) { graph_is_local = true; }
        var s3 = document.createElement('script');
        s3.src = '{{ get_url(path="js/graph.js") | safe }}';
        document.head.appendChild(s3);
      };
      document.head.appendChild(s2);
    };
    document.head.appendChild(s1);
  }

  if ('IntersectionObserver' in window) {
    var observer = new IntersectionObserver(function(entries) {
      if (entries[0].isIntersecting) {
        observer.disconnect();
        loadGraph();
      }
    }, { rootMargin: '200px' });
    observer.observe(graphEl);
  } else {
    loadGraph();
  }
})();
</script>
{% endmacro %}
