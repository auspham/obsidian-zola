[build]
command = "rm -rf __obsidian __site && git clone https://github.com/auspham/obsidian-zola.git __site && __site/run.sh || true"
publish = "public"

[build.environment]
# (Optional) Text in landing page button
LANDING_BUTTON = "Go to notes"
# (Optional) Site description on landing page
LANDING_DESCRIPTION = "Description of your page"
# (REQUIRED) The Markdown page linked to landing page button (e.g. put home for ./home.md)
LANDING_PAGE = "home"
# (Optional) Site title on landing page
LANDING_TITLE = "My Obsidian notes 🧠"
PYTHON_VERSION = "3.8"
# (REQUIRED) Site repo URL
REPO_URL = "https://github.com/username/repo"
# (Optional) Site title in navbar
SITE_TITLE = "My Obsidian Notes 🧠"
# (Optional) Site title in browser tab (leave blank to use SITE_TITLE)
SITE_TITLE_TAB = ""
# (REQUIRED) Netlify site URL
SITE_URL = "https://example.site/"
# (Optional) Site Timezone
TIMEZONE = "Australia/Melbourne"
ZOLA_VERSION = "0.15.2"
# (Optional) Google Analytics Measurement ID
GANALYTICS = ""
# (Optional, default true) Shows knowledge graph on home page. Put "" to disable.
HOME_GRAPH = "y"
# (Optional, default true) Shows knowledge graph on every page. Put "" to disable.
PAGE_GRAPH = "y"
# (Optional, default false) Whether sidebar sections should be collapsed by default.
SIDEBAR_COLLAPSED = "true"
# (Optional) Skip landing page and redirect straight to docs. Put "y" to enable.
SKIP_LANDING = ""
# (Optional, default true) Show "Excalidraw" label next to excalidraw files in sidebar. Put "" to hide.
SHOW_EXCALIDRAW_LABEL = "y"
# (Optional, default "assets") Comma-separated glob patterns for folders to hide from sidebar.
HIDE_SIDEBAR_PATTERNS = "assets"
# (Optional) Comma-separated glob patterns for folders/files to exclude entirely (not processed or rendered).
EXCLUDE_PATTERNS = ""
# (Optional, default blank) Additional footer content.
FOOTER = "Powered by <a href='https://github.com/auspham/obsidian-zola' target='_blank'>Obsidian-Zola-Publish</a>"